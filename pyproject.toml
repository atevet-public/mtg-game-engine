[project]
name = "mtg-game-engine"
version = "0.1.0"
description = "A Magic: The Gathering game engine"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.14.0",
    "mypy>=1.11.0",
    "black>=24.10.0",

]

[tool.pytest.ini_options]
testpaths = ["src/mtgengine/"]
addopts = "-v --cov=src/mtgengine --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true

[tool.black]
line-length = 100
