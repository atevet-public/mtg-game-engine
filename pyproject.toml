[project]
name = "mtg-game-engine"
version = "0.1.0"
description = "A Magic: The Gathering game engine"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pyventus>=0.7.2",
    "uvicorn>=0.30.0",
]

[project.scripts]
mtgtable = "mtgengine.server.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.14.0",
    "mypy>=1.11.0",
    "black>=24.10.0",

]

[tool.pytest.ini_options]
testpaths = ["mtgengine/"]
addopts = "-v --cov=mtgengine --cov-report=term-missing"

[tool.ruff]
line-length = 100

[tool.mypy]
ignore_missing_imports = true

[tool.black]
line-length = 100
